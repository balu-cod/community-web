# Production Nginx reverse proxy configuration for TECH / COMMONS
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    upstream fastapi_backend {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name tech-commons.org www.tech-commons.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name tech-commons.org www.tech-commons.org;

        ssl_certificate /etc/letsencrypt/live/tech-commons.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tech-commons.org/privkey.pem;

        # W3C DID:web Resolution Endpoint
        location = /.well-known/did.json {
            proxy_pass http://fastapi_backend/.well-known/did.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            default_type application/did+json;
            add_header Access-Control-Allow-Origin * always;
        }

        # WebSocket Gateway
        location /api/ws/ {
            proxy_pass http://fastapi_backend/api/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        # Backend REST API
        location /api/ {
            proxy_pass http://fastapi_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static Frontend Application
        location / {
            root /var/www/tech_commons;
            index index.html tech_commons_standalone.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
